<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-container{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;

        }
        .card{
           
            width: 250px;
         border: 1px solid;
         box-sizing: border-box;
        }
        .card-top{
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
          

        }
        .product-image{
        height: 80%;
        width: 50%;
        margin-top: 20px;
        object-fit: 100% 100%;
        }
        .card-bottom{
            height: 150px;
            width: 80%;
            padding: 20px;
            border: 1px solid;
        }
        .card-bottom p{
             border: 1px solid;
           display: flex;
           align-items: end;
           justify-content: space-between;

           
        }
    </style>
</head>
<body>
    <div class="product-container" id="product"></div>
    <script>
        let product = document.getElementById('product')
        const fetchProduct = async()=>{
            try {
                const res = await fetch('https://fakestoreapi.com/products')
                let data = await res.json()
                console.log(data);

                data.forEach((d)=>{
                    const div = document.createElement('div')
                    div.innerHTML = `
                    
                    <div class="card">
                        <div class="card-top">
                            <img src=${d.image} class="product-image"/>
                            </div>
                            <div class="card-bottom">
                                <h3>${d.title}</h3>
                              <p>
                                
                                <span>${d.price}</span>
                                <button>Add to Card</button>
                                </p>
                        </div>
                    `
                    product.appendChild(div)
                })
                
            } catch (error) {
                console.log(error);
                
            }
        }
        fetchProduct()
    </script>
</body>
</html>
