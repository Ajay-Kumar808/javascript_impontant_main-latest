<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #out-linebox{
            width: 500px;
            height: 200px;
            margin: 100px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #out-linebox>div{
            width: 100px;
            height: 100px;
            border: 1px solid;
            border-radius: 8px;
        }
       #box1{
            background-color: red;
        }
        #box2{
            background-color: blue;
        }
       #box3{
            background-color: yellow;
        }
        #box4{
            background-color: pink;
        }

    </style>
</head>

<body>
    <div id="out-linebox">
        <div class="button" id="box1"></div>
        <div class="button" id="box2"></div>
        <div class="button" id="box3"></div>
        <div class="button" id="box4"></div>
    </div>

<script>
   let button = document.querySelectorAll('.button')
   console.log(button)

   let body = document.querySelector('body')
   console.log(body)

button.forEach(function(bu){
    bu.addEventListener('click',function(e){
    console.log("hi ajay")
  
   if(e.target.id === 'box1'){
    body.style.backgroundColor = "red"
   }
   else if(e.target.id === 'box2'){
    body.style.backgroundColor = "blue"
   }
   else if(e.target.id === 'box3'){
    body.style.backgroundColor = "yellow"
   }
   else if(e.target.id === 'box4'){
    body.style.backgroundColor = "pink"
   }
})
})
</script>
</body>

</html>
