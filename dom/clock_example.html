<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="colck">00:00:00</h1>

    <script>
        function demo(){
           let colck = document.getElementById('colck')
           let date = new Date()
           let date2 = date.toLocaleTimeString()
           colck.innerText = date2
        }
        setInterval(demo,1000)
    </script>
</body>
</html>
