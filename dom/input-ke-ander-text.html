<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" name="" id="text" placeholder="Enter you name">
    <button onclick="demo()">Add</button>
    <ul id="hello">
        <li>Ajay</li>
    </ul>

    <script>
        let texts = document.getElementById('text')
        console.log(texts)
        let hellos = document.getElementById('hello')
        console.log(hellos)

        function demo() {
            console.log(texts.value)
            let li = document.createElement('li')
            // console.log(li)
            li.innerText = texts.value
            hellos.appendChild(li)



        }

    </script>
</body>

</html>
