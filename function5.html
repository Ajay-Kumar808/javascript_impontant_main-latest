<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <script>
        // <!-- recursive function -->

        function cd(num){
            if(num===0){
                alert("Countdown is over")
            }
            else{
                console.log(num)
                cd(num-1)
            }
        }
        cd(5)

    </script>
</body>
