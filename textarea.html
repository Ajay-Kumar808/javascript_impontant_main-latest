<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Mini HTML compiler</h1>
    <textarea name="" onkeyup="demo()" id="t1" rows="10" cols="50"></textarea> 
    //onkeypress="demo()"
  
    <hr>
    <p id="p1"></p>


    <script>
        function demo(){
            p1.innerHTML = t1.value;
        }
    </script>
</body>
</html>
